# ============================================================
# free_proxy 配置示例
# 使用：复制本文件为 config.yaml，填写你的供应商凭证后启动。
# 敏感凭证推荐用 ${ENV_NAME} 引用环境变量，避免把密钥提交到 git。
# ============================================================

server:
  listen: "0.0.0.0:8899"       # 前向代理监听地址（业务代码把 HTTP 代理指向这里）
  backlog: 256
  connect_timeout: 10           # 连接上游代理的超时（秒）

control:
  listen: "127.0.0.1:8891"     # 控制面 API（建议仅监听内网，别暴露公网）
  token: ""                     # 留空=不鉴权；填了则需请求头 Authorization: Bearer <token>

pool:
  strategy: weighted            # round_robin | random | fastest | weighted
  max_size: 500                 # 池内代理上限
  min_size: 50                  # 低于此值时日志提示补货（预留）
  ttl: 60                       # 供应商未返回过期时间时，代理默认存活秒数
  check_interval: 30            # 健康检查周期（秒）
  check_timeout: 10             # 单次健康检查超时（秒）
  check_url: "https://www.baidu.com"   # 健康检测目标（建议国内可达、稳定）
  max_fail: 3                   # 连续失败 N 次判死淘汰
  refresh_interval: 60          # 向供应商拉取新代理的周期（秒）
  cooldown: 5                   # 判死后冷却秒数（预留）

store:
  backend: memory               # memory（单进程，默认） | redis（多服务器共享同池）
  redis_url: "redis://127.0.0.1:6379/0"
  redis_key: "free_proxy:pool"

# ------------------------------------------------------------
# 供应商接入：type 可选 pinzan | kuaidaili | julang | generic | static
# 想加新的代理商？优先用 generic（纯配置接入）；只有签名算法特殊才需要写新适配器。
# ------------------------------------------------------------
providers:
  # >>> 品赞代理（ipzan.com）<<<
  # API/参数参考后台「生成提取链接」：https://www.ipzan.com/user/extractapi
  - name: pinzan
    type: pinzan
    enabled: true
    "no": "${PINZAN_NO}"           # 套餐/业务编号（YAML 里 no 必须加引号，否则被当布尔 False）
    secret: "${PINZAN_SECRET}"     # 套餐提取密钥
    num: 5
    mode: auth                     # auth=账号密码鉴权 | whitelist=白名单鉴权
    auth_user: "${PINZAN_USER}"    # mode=auth 时：套餐账号（提取的 IP 用此账密连接）
    auth_password: "${PINZAN_PWD}" # mode=auth 时：套餐密码
    pool: quality                  # 可选：IP 池类型（如 quality 优质池）
    # minute: 1                    # 可选：IP 有效时长(分钟) 1/3/5/10/15/30
    # repeat: 1                    # 可选：是否允许重复提取
    # 提取前需把「运行 free_proxy 的机器」公网出口 IP 加入套餐白名单
    # api_url: "https://service.ipzan.com/core-extract"   # 默认值，一般不改

  # >>> 快代理（kuaidaili.com）<<<
  # 文档：https://www.kuaidaili.com/doc/api/getdps/
  - name: kuaidaili
    type: kuaidaili
    enabled: true
    api_url: "https://dps.kdlapi.com/api/getdps"   # 私密代理；独享=getkps、隧道=gettps
    secret_id: "${KUAIDAILI_SECRET_ID}"
    sign_type: token               # token（默认）| hmacsha1
    secret_token: "${KUAIDAILI_SECRET_TOKEN}"
    # 若用 hmacsha1，注释上面两行改为：
    # sign_type: hmacsha1
    # secret_key: "${KUAIDAILI_SECRET_KEY}"
    num: 5
    dedup: 1                       # 过滤当天已提取过的 IP

  # >>> 巨量代理（juliangip.com）<<<
  # 文档：https://www.juliangip.com/help/api/dynamic/
  - name: julang
    type: julang
    enabled: true
    api_url: "https://v2.api.juliangip.com/dynamic/getips"  # 按量=postpay/getips，企业版=company/...
    trade_no: "${JULIANG_TRADE_NO}"
    api_key: "${JULIANG_API_KEY}"  # 仅参与 MD5 签名，不进入请求参数
    num: 5
    pt: 1                          # 1=HTTP 2=SOCKS
    ip_remain: 1                   # 返回剩余可用时长，用于精确计算过期时间

  # >>> 任意代理商：通用模板，零代码接入 <<<
  # - name: any_vendor
  #   type: generic
  #   enabled: false
  #   url: "https://vendor.example/api/getip?key={secret}&num={num}"
  #   method: GET
  #   secret: "${ANY_VENDOR_KEY}"
  #   params:
  #     num: 5
  #   # 可选签名：md5 | hmacsha1 | token | none（默认 none，凭证直接进 params）
  #   # sign:
  #   #   type: md5
  #   #   key: "${ANY_VENDOR_KEY}"
  #   #   param: sign
  #   response:
  #     format: json            # json | text
  #     success_path: code      # 成功判定字段
  #     success_equals: 0       # 成功时的取值（快代理=0、巨量=200）
  #     list_path: "data.proxy_list"   # 代理列表字段路径（品赞为 data.list）

